name: Daily Repository Automation

on:
  schedule:
    - cron: "0 6,12,18 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-activity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run activity update
        run: node scripts/updateActivity.js

      - name: Commit changes
        run: |
          git config --global user.name "GitHub Automation Bot"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update daily repository activity"
            git push
          fi