name: Daily Repository Automation

on:
  schedule:
    # Runs 10 times every day (UTC)
    - cron: "0 0,2,4,7,9,12,14,16,19 * * *"

  # Allows you to run the workflow manually
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-activity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run activity update
        run: node scripts/updateActivity.js

      - name: Configure Git
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Commit and push changes
        run: |
          git add data/activity.json logs/activity.md

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update daily repository activity"
            git push origin main
          fi